name: Desktop

# Builds the macOS .dmg, the Windows setup .exe and the Linux .AppImage, and
# for each platform the in-app update (Simplixity-payload-<platform>.zip/.json,
# see updater.py). Run it by hand (Actions -> Desktop -> Run workflow), or push
# a tag like `desktop-v0.2.0` to also attach them all to a GitHub release:
# installed apps then offer that release as an update.
#
# Whoever can change what runs here can ship code to every install (see
# updater.py), so actions are pinned by commit SHA, not by a movable tag.

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

# Python reads files as UTF-8 everywhere, as on macOS and Linux (Windows'
# default is its ANSI code page).
env:
  PYTHONUTF8: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
          - os: windows-latest
          - os: ubuntu-22.04    # oldest glibc still on GitHub: the AppImage runs on anything newer
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Linux libraries for Qt WebEngine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libfontconfig1 libdbus-1-3

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - run: uv sync --locked --group build --group dev
      - run: uv run pytest -q
      # Simplixity and SearXNG at the refs pinned in upstream.toml.
      - run: uv run python fetch.py
      - run: uv run python build.py

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: simplixity-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/Simplixity-payload-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --latest
